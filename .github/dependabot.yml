version: 2

updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"

  # Julia — Project.toml [compat] entries (replaces CompatHelper; the action
  # repo juliaregistries/compathelper was deleted upstream)
  - package-ecosystem: julia
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - julia
    commit-message:
      prefix: "deps"

  # Python (pip) — oracle/Dockerfile and pyproject.toml
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps"
