name: TagBot

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  tagbot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          changelog: |
            ${{ github.ref_name }}